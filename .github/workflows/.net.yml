name: mydonet project

on: 
  push:
    branches:
      - develop

jobs:
  dotnet_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.100'

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
             -Dsonar.organization=nandhini
             -Dsonar.projectKey=Nandini1229_nopCommerce
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Publish .NET project
        run: dotnet publish -c Release src/Presentation/Nop.Web/Nop.Web.csproj -o nandhini
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build Docker image
        env:
           ECR_REGISTRY: aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 088609649172.dkr.ecr.ap-southeast-1.amazonaws.com
           ECR_REPOSITORY: newrepo
           IMAGE_TAG: latest
        run:
          docker build -t newrepo .
          docker tag newrepo:latest 088609649172.dkr.ecr.ap-southeast-1.amazonaws.com/newrepo:latest
          docker push 088609649172.dkr.ecr.ap-southeast-1.amazonaws.com/newrepo:latest


